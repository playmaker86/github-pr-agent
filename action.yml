name: 'PR Code Review'
description: '使用 DeepSeek API 对 Pull Request 进行 AI 代码审查'
author: 'github-pr-agent'

inputs:
  github_token:
    description: 'GitHub token，默认使用 workflow 的 GITHUB_TOKEN'
    default: ${{ github.token }}
    required: false
  api_key:
    description: 'DeepSeek API Key'
    required: true
  model:
    description: '使用的 AI 模型'
    default: 'deepseek-v4-flash'
    required: false

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'check-circle'
  color: 'purple'
